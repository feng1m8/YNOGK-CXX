[build-system]
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core",
    "cython-cmake",
    "cython",
    "numpy",
]

[tool.scikit-build]
cmake.args = ["-GNinja"]
ninja.make-fallback = false
wheel.py-api = "cp39"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "CMakeLists.txt"
regex = "VERSION \"(?P<value>[0-9]+(\\.[0-9]+)*)\""

[project]
name = "ynogk"
dynamic = ["version"]
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "YNOGK/LICENSE"]
readme = "YNOGK/README.md"
